<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf9f8"/>
  
  <!-- Logo circle -->
  <circle cx="440" cy="250" r="60" fill="#154212"/>
  <text x="412" y="272" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#faf9f8">PG</text>
  <line x1="395" y1="290" x2="485" y2="290" stroke="#faf9f8" stroke-width="2"/>
  
  <!-- Brand name -->
  <text x="530" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#154212" letter-spacing="-1">PGKhata</text>
  
  <!-- Tagline -->
  <text x="530" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#4a6b4a">Rent Collection Without the Chaos</text>
  
