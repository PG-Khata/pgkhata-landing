  <circle cx="650" cy="440" r="8" fill="#154212"/>
  <text x="670" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#1a1c1c">Send via WhatsApp</text>
  
  <circle cx="900" cy="440" r="8" fill="#154212"/>
  <text x="920" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#1a1c1c">Track Payments</text>
  
  <!-- Connecting line -->
  <line x1="208" y1="440" x2="422" y2="440" stroke="#154212" stroke-width="2"/>
  <line x1="438" y1="440" x2="642" y2="440" stroke="#154212" stroke-width="2"/>
  <line x1="658" y1="440" x2="892" y2="440" stroke="#154212" stroke-width="2"/>
